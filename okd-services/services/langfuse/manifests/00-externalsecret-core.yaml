# Langfuse secrets from Vault (okd/platform/langfuse/core).
# One secret referenced by all chart components (postgres/valkey/clickhouse/minio
# existingSecret, nextauth/salt/encryptionKey secretKeyRef, LANGFUSE_INIT_* env).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: langfuse-core
  namespace: langfuse
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: langfuse-core
    creationPolicy: Owner
  data:
    - secretKey: nextauth-secret
      remoteRef:
        key: okd/platform/langfuse/core
        property: nextauth_secret
    - secretKey: salt
      remoteRef:
        key: okd/platform/langfuse/core
        property: salt
    - secretKey: encryption-key
      remoteRef:
        key: okd/platform/langfuse/core
        property: encryption_key
    - secretKey: pg-password
      remoteRef:
        key: okd/platform/langfuse/core
        property: pg_password
    - secretKey: clickhouse-password
      remoteRef:
        key: okd/platform/langfuse/core
        property: clickhouse_password
    - secretKey: redis-password
      remoteRef:
        key: okd/platform/langfuse/core
        property: redis_password
    - secretKey: minio-root-user
      remoteRef:
        key: okd/platform/langfuse/core
        property: minio_root_user
    - secretKey: minio-root-password
      remoteRef:
        key: okd/platform/langfuse/core
        property: minio_root_password
    - secretKey: init-user-email
      remoteRef:
        key: okd/platform/langfuse/core
        property: init_user_email
    - secretKey: init-user-name
      remoteRef:
        key: okd/platform/langfuse/core
        property: init_user_name
    - secretKey: init-user-password
      remoteRef:
        key: okd/platform/langfuse/core
        property: init_user_password
    - secretKey: init-project-public-key
      remoteRef:
        key: okd/platform/langfuse/core
        property: init_project_public_key
    - secretKey: init-project-secret-key
      remoteRef:
        key: okd/platform/langfuse/core
        property: init_project_secret_key
