apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-kv
spec:
  provider:
    vault:
      server: https://hashicorpvault.cgraaaj.in
      path: kv-v2
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes-okd
          role: external-secrets-okd
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
