# One-time cluster permissions for platform GitOps (apply before bootstrap sync).
# The Argo CD operator creates namespace-scoped Roles only; platform apps need cluster scope.
apiVersion: argoproj.io/v1beta1
kind: ArgoCD
metadata:
  name: argocd
  namespace: argocd
spec:
  namespaceManagement:
    - name: "*"
      allowManagedBy: true
