apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-tls-reader
  namespace: argocd
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["argocd-tls"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-tls-reader-router
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argocd-tls-reader
subjects:
  - kind: ServiceAccount
    name: router
    namespace: openshift-ingress
