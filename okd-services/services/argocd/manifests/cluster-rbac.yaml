# Platform GitOps needs cluster-scoped reconcile (CRDs, ClusterIssuers, StorageClasses, Routes).
# The operator creates a namespace Role only; this ClusterRole mirrors those rules cluster-wide.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argocd-argocd-application-controller
  labels:
    app.kubernetes.io/name: argocd
    app.kubernetes.io/part-of: argocd
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["impersonate"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argocd-argocd-application-controller
  labels:
    app.kubernetes.io/name: argocd
    app.kubernetes.io/part-of: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argocd-argocd-application-controller
subjects:
  - kind: ServiceAccount
    name: argocd-argocd-application-controller
    namespace: argocd
