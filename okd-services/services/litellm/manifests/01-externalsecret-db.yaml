# LiteLLM PostgreSQL credentials from Vault (okd/platform/litellm/db).
# Consumed by the bitnami postgresql chart (auth.existingSecret) and by the
# litellm proxy/migration job (db.secret).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: litellm-db
  namespace: llm
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: litellm-db
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: okd/platform/litellm/db
        property: username
    - secretKey: password
      remoteRef:
        key: okd/platform/litellm/db
        property: password
    - secretKey: postgres-password
      remoteRef:
        key: okd/platform/litellm/db
        property: postgres_password
