# Managed by Argo CD (this instance only manages labeled namespaces).
# PSA enforce=privileged + label-sync off: the PostgreSQL pod mounts a
# local-path (hostPath) PVC and needs seLinuxOptions type spc_t, which PSA
# restricted forbids. Same pattern as the observability namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: llm
  labels:
    argocd.argoproj.io/managed-by: argocd
    security.openshift.io/scc.podSecurityLabelSync: "false"
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/warn-version: latest
