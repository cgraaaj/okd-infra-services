# LiteLLM core secrets from Vault (okd/platform/litellm/core).
# Keys are env-style because the chart injects them via envFrom (environmentSecrets).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: litellm-core
  namespace: llm
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: litellm-core
    creationPolicy: Owner
  data:
    - secretKey: MASTER_KEY
      remoteRef:
        key: okd/platform/litellm/core
        property: master_key
    - secretKey: LANGFUSE_HOST
      remoteRef:
        key: okd/platform/litellm/core
        property: langfuse_host
    - secretKey: LANGFUSE_PUBLIC_KEY
      remoteRef:
        key: okd/platform/litellm/core
        property: langfuse_public_key
    - secretKey: LANGFUSE_SECRET_KEY
      remoteRef:
        key: okd/platform/litellm/core
        property: langfuse_secret_key
