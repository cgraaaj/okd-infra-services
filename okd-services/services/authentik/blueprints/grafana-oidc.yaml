# Authentik OAuth2/OIDC provider + application for Grafana.
# Client secret is injected by scripts/configure-oidc.sh before apply.
# This file is a reference template; actual provisioning is done via ak shell.
version: 1
metadata:
  name: grafana-oidc-prod
  labels:
    blueprints.goauthentik.io/description: "Grafana prod OIDC (grafana.apps.okd.cgraaaj.in)"
entries:
  - id: grafana-oauth-provider
    model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: grafana-prod
    attrs:
      name: grafana-prod
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, Grafana groups]]
      client_type: confidential
      client_id: grafana-prod
      client_secret: __GRAFANA_OIDC_CLIENT_SECRET__
      redirect_uris:
        - matching_mode: strict
          url: https://grafana.apps.okd.cgraaaj.in/login/generic_oauth
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: user_username
      issuer_mode: per_provider

  - model: authentik_core.application
    identifiers:
      slug: grafana
    attrs:
      name: Grafana
      slug: grafana
      provider: !KeyOf grafana-oauth-provider
      meta_launch_url: https://grafana.apps.okd.cgraaaj.in/
      meta_description: OKD metrics dashboards
      policy_engine_mode: any
