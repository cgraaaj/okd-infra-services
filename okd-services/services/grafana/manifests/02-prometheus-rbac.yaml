# Dedicated SA for querying OKD's built-in Prometheus and Alertmanager.
# cluster-monitoring-view is an OKD built-in ClusterRole that grants read
# access to all endpoints in openshift-monitoring (Prometheus, Alertmanager,
# Thanos querier). A long-lived token for this SA is generated by
# scripts/configure-oidc.sh and stored in Vault -> grafana-core secret.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-prometheus-reader
  namespace: grafana
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: grafana-prometheus-reader
subjects:
  - kind: ServiceAccount
    name: grafana-prometheus-reader
    namespace: grafana
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-monitoring-view
