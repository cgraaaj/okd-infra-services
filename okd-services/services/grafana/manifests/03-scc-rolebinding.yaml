# Allow the Grafana SA to use the privileged SCC so the pod may set
# seLinuxOptions.type=spc_t — required to write the local-path (hostPath) PVC.
# Same pattern as langfuse and observability namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: system:openshift:scc:privileged
  namespace: grafana
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:privileged
subjects:
  - kind: ServiceAccount
    name: grafana
    namespace: grafana
