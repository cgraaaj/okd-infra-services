# Grafana core secrets from Vault (okd/platform/grafana/core).
# admin-user/admin-password consumed by Helm admin.existingSecret.
# GF_* keys injected as env vars via envFromSecret and consumed by grafana.ini
# and datasource provisioning interpolation.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-core
  namespace: grafana
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: grafana-core
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: okd/platform/grafana/core
        property: admin_user
    - secretKey: admin-password
      remoteRef:
        key: okd/platform/grafana/core
        property: admin_password
    - secretKey: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
      remoteRef:
        key: okd/platform/grafana/core
        property: client_secret
    - secretKey: GF_PROMETHEUS_BEARER_TOKEN
      remoteRef:
        key: okd/platform/grafana/core
        property: prometheus_token
