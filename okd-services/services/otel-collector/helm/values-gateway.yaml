mode: deployment
fullnameOverride: otel-gateway

image:
  repository: otel/opentelemetry-collector-contrib

nodeSelector:
  node-role.kubernetes.io/worker: ""

securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

service:
  enabled: true

ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    protocol: TCP
  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    protocol: TCP

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
  processors:
    batch:
      send_batch_size: 10000
      timeout: 5s
    memory_limiter:
      check_interval: 1s
      limit_percentage: 75
      spike_limit_percentage: 15
  exporters:
    clickhouse:
      endpoint: tcp://otelcollector:okd-hyperdx-otel-2026@hyperdx-hdx-oss-v2-clickhouse.observability.svc.cluster.local:9000?dial_timeout=10s&compress=lz4&async_insert=1
      database: default
      create_schema: true
      logs_table_name: otel_logs
      traces_table_name: otel_traces
      timeout: 10s
      retry_on_failure:
        enabled: true
        initial_interval: 5s
        max_interval: 30s
        max_elapsed_time: 300s
      sending_queue:
        queue_size: 1000
  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [clickhouse]
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [clickhouse]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [clickhouse]
