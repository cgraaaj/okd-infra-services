apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: okd-prod-bootstrap
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: platform
  source:
    repoURL: https://github.com/cgraaaj/okd-infra-services.git  # update when repo published
    targetRevision: main
    path: okd-gitops/environments/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
